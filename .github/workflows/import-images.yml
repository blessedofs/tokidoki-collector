name: Import approved card artwork

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify importer script
        run: |
          ls -la scripts
          test -f scripts/import_images.py || (echo 'Missing scripts/import_images.py' && exit 1)

      - name: Run image importer
        run: python scripts/import_images.py

      - name: Commit imported images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ cards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import approved card artwork'
            git push
          fi

